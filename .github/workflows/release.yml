# amwall — release builder.
# Copyright (C) 2026  amwall contributors. Licensed GPL-3.0-or-later.
#
# Builds the amwall MSI installer on a Windows runner and attaches
# it to a GitHub Release. Triggered ONLY by an explicit version tag
# push (`git tag v0.1.0 && git push origin v0.1.0`) — pushes to
# main don't run this workflow.
#
# Output: target\wix\amwall-<version>-x86_64.msi attached to the
# tag's GitHub Release alongside the portable ZIP.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  # Needed by softprops/action-gh-release to create the Release
  # and attach the MSI as an asset. Read-only `contents: read` is
  # the workflow default; releases need contents: write.
  contents: write

jobs:
  build-msi:
    name: Build MSI installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Pin to 1.85 to match Cargo.toml's rust-version. dtolnay's
        # action is the maintained shim; rustup is preinstalled on
        # the windows-latest runner so this resolves quickly.
        # `components: clippy` is required because dtolnay's action
        # only auto-includes clippy on the `stable` channel — when a
        # specific version is pinned, clippy must be requested
        # explicitly or `cargo clippy` errors with "not installed".
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # The key changes with the lockfile/toolchain so incompatible
          # build artifacts are not reused between release builds.
          cache-on-failure: true

      - name: Run gates
        # Mirror the local gating commands (build / clippy / test)
        # so a tag pointing at a broken commit fails fast before
        # we burn time on the WiX build. The local repo runs the
        # same three checks before each commit.
        # PowerShell does not chain on success by default, so each
        # command is followed by an explicit $LASTEXITCODE check —
        # otherwise a clippy or build failure would be silently
        # swallowed if the trailing `cargo test` happened to succeed.
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --all-targets --target x86_64-pc-windows-msvc -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer changelog is current
        # The MSI embeds wix/Changelog.rtf as its "What's new" page
        # (wix/main.wxs ChangelogDlg, ScrollableText SourceFile). That
        # RTF is hand-maintained and separate from the annotated-tag
        # release body, so it was forgotten twice running — v1.1.16 and
        # v1.1.17 both shipped an installer showing the PRIOR version's
        # changelog. Hard-fail the release build unless the RTF pins the
        # Cargo.toml version as "(current)" at the top, so a stale
        # installer changelog can never silently ship again.
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' |
                      ForEach-Object { $_.Matches[0].Groups[1].Value })
          $needle = "v$version (current)"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version."
          }
          $rtf = Get-Content -Raw wix/Changelog.rtf
          if ($rtf -notmatch [regex]::Escape($needle)) {
            Write-Error "wix/Changelog.rtf does not pin '$needle'. Update the installer 'What's new' page for this release before tagging."
            exit 1
          }
          Write-Host "Installer changelog pins $needle"

      - name: Ensure WiX Toolset 3.x is on PATH
        # Discover the installed 3.x version instead of assuming a runner path.
        # Install it only if absent; the shared script needs candle/light/torch.
        shell: pwsh
        run: |
          $wixBin = Get-ChildItem "${env:ProgramFiles(x86)}/WiX Toolset v3*/bin/candle.exe" -ErrorAction SilentlyContinue |
                    Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $wixBin) {
            choco install wixtoolset --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $wixBin = Get-ChildItem "${env:ProgramFiles(x86)}/WiX Toolset v3*/bin/candle.exe" -ErrorAction SilentlyContinue |
                      Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty DirectoryName
          }
          if (-not $wixBin) { throw 'WiX Toolset 3.x was not found after installation.' }
          $wixBin >> $env:GITHUB_PATH
          Write-Host "Using WiX from $wixBin"

      - name: Build multilingual MSI with embedded transforms
        # Delegated to scripts/build-msi.ps1 so this workflow and the
        # local "Build MSI installer" task in .vscode/tasks.json stay
        # byte-identical — Ctrl+Shift+B and a tag push produce the
        # same MSI from the same script.
        shell: pwsh
        # Replace local test installations that carry the release version too.
        run: ./scripts/build-msi.ps1 -AllowSameVersionUpgrades

      - name: Locate MSI + create stable-named copy
        # The build script names its output `amwall-<version>-x86_64.msi`,
        # which is great for the asset list (users can tell which
        # version they're grabbing) but breaks
        # `releases/latest/download/<filename>` URLs in the README
        # download button — those need a filename that doesn't
        # change between releases. Solve by attaching BOTH:
        #   - amwall-<version>-x86_64.msi  (versioned, original)
        #   - amwall-x86_64.msi            (stable, copy)
        id: msi
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' |
                      ForEach-Object { $_.Matches[0].Groups[1].Value })
          $msi = Get-Item "target/wix/amwall-$version-x86_64.msi" -ErrorAction SilentlyContinue
          if (-not $msi) {
            Write-Error "No MSI found under target/wix"
            exit 1
          }
          $stable = Join-Path $msi.Directory.FullName "amwall-x86_64.msi"
          Copy-Item $msi.FullName $stable -Force
          "versioned=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          "stable=$stable" >> $env:GITHUB_OUTPUT

      - name: Build portable ZIP
        # amwall already supports portable mode (src/paths.rs detects
        # an `amwall.ini` marker next to amwall.exe and routes profile,
        # settings, log, etc. into the exe's directory instead of
        # %APPDATA%). Ship a zip containing the release exe plus an
        # empty `amwall.ini` so unzipping anywhere — USB drive, sandbox
        # VM, secondary user account — gets a self-contained install
        # with no system-wide footprint and no installer step.
        #
        # Two zips: versioned (asset-list clarity) + stable-named (so
        # the README's "Download portable" button can use
        # releases/latest/download/amwall-x86_64-portable.zip).
        # Layout is intentionally minimal: exe + marker. The exe is
        # fully self-contained (static CRT from v1.1.7, embedded
        # resources, embedded i18n) so no DLLs / assets / docs ride
        # along.
        id: portable
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP ("amwall-portable-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/amwall.exe" $stage
          # Empty file IS the marker — paths::is_portable only checks
          # for file existence, not contents. The format (when non-
          # empty) is the same key=value store as settings.txt in
          # portable mode, so users can pre-seed preferences before
          # zipping for distribution.
          New-Item -ItemType File -Path (Join-Path $stage "amwall.ini") -Force | Out-Null
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' |
                      ForEach-Object { $_.Matches[0].Groups[1].Value })
          $versioned = Join-Path "target/wix" "amwall-$version-x86_64-portable.zip"
          $stable    = Join-Path "target/wix" "amwall-x86_64-portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $versioned -Force
          Copy-Item $versioned $stable -Force
          "versioned=$versioned" >> $env:GITHUB_OUTPUT
          "stable=$stable" >> $env:GITHUB_OUTPUT
          Write-Host "Built portable zip: $versioned"

      - name: Extract release notes from tag annotation
        # The Windows MSI is produced from the main branch which
        # also carries the Linux port work — `generate_release_notes:
        # true` autopopulates the body from EVERY commit since the
        # previous tag, which for v1.1.5 was 30+ commits mostly
        # about the Mint port. That's noise for a Windows-only MSI
        # release. We tag releases with `git tag -a v1.1.5 -m '...'`
        # carrying a focused, Windows-user-facing description, so
        # read that annotation back and feed it to the release body.
        # Falls back to "no description" if the tag is lightweight
        # (no annotation), which makes that mistake obvious and
        # easy to fix in a re-tag.
        id: notes
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          # actions/checkout@v4 fetches only the tagged COMMIT and writes
          # a LIGHTWEIGHT local tag pointing at it — so `git tag -l
          # --format='%(contents)'` returns the COMMIT message, not the
          # annotation. This silently shipped the bump-commit subject
          # ("release: bump version to 1.1.16") as the v1.1.16 body until
          # caught; earlier tags happened to sit on rich feature commits
          # so the same bug looked correct. Force-fetch the real annotated
          # tag object from origin so %(contents) resolves the tag message.
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Only read %(contents) when the object is a genuine annotated
          # tag; a lightweight tag would otherwise fall through to the
          # commit message and mask the mistake.
          $type = (git cat-file -t $tag) 2>$null
          if ($type -eq 'tag') {
            $body = git tag -l --format='%(contents)' $tag
          } else {
            $body = ''
          }
          if (-not $body) {
            throw 'Release tags must be annotated with the user-facing changelog.'
          }
          # Multi-line GitHub Actions output via the heredoc-style
          # EOF marker; GHA enforces no-marker-in-content via a
          # random delimiter, which we approximate with a UUID-y
          # constant unlikely to appear in a release message.
          $delim = "EOF_RELEASE_NOTES_d4f8a7b3"
          "body<<$delim" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "$delim"   >> $env:GITHUB_OUTPUT

      - name: Create draft release with MSI
        # `draft: true` so the user reviews the release before
        # publishing — first-time releases especially. Switch to
        # false once the workflow is proven for the project.
        # Body comes from the annotated tag message (see prev step)
        # instead of GitHub's auto-changelog so the Windows MSI's
        # notes don't get spammed with unrelated commits from the
        # in-progress Linux port.
        # Both the versioned and the stable-named MSI are
        # attached so the README's "Download" button can use
        # `releases/latest/download/amwall-x86_64.msi`. Same
        # versioned/stable pairing for the portable zip so a
        # similarly-stable "Download portable" link works.
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body: ${{ steps.notes.outputs.body }}
          files: |
            ${{ steps.msi.outputs.versioned }}
            ${{ steps.msi.outputs.stable }}
            ${{ steps.portable.outputs.versioned }}
            ${{ steps.portable.outputs.stable }}
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
